<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>運動会 見本動画・音源</title>
<style>
  :root { --bg:#f6f3ec; --card:#fff; --ink:#2b2a28; --sub:#7a756c; --accent:#e0703a; --line:#e6e0d4; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif; padding:24px 16px 48px; }
  main { max-width:880px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  h2 { font-size:1.05rem; margin:0 0 10px; }
  .lead { color:var(--sub); margin:0 0 20px; font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  section + section { margin-top:24px; }
  button, a.btn { font:inherit; font-size:.95rem; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; color:inherit; text-decoration:none; display:inline-block; }
  button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  audio { width:100%; margin-top:4px; }
  .meta { color:var(--sub); font-size:.85rem; margin:0 0 8px; }
  .list { display:grid; gap:10px; margin-bottom:16px; }
  .item { text-align:left; padding:14px 16px; display:flex; justify-content:space-between; gap:12px; align-items:center; width:100%; }
  .item small { color:var(--sub); }
  .item.active { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .stage { background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/9; display:grid; place-items:center; color:#ddd; }
  video { width:100%; height:100%; display:block; background:#000; }
  video.flip { transform:scaleX(-1); }
  .tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
  .tools .label { color:var(--sub); font-size:.85rem; margin-right:2px; }
  .sep { flex-basis:100%; height:0; }
  .note { color:var(--sub); font-size:.8rem; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>🎵 運動会 見本動画・音源</h1>
  <p class="lead">教職員向け・持ち出し厳禁。練習用に自由に再生してください。</p>

  <section id="audioSec" class="card">
    <h2>🎶 音源</h2>
    <div id="audioList"></div>
  </section>

  <section id="videoSec">
    <h2>💃 ダンス見本動画</h2>
    <div class="list" id="list"></div>
    <div class="stage" id="stage"><span>動画をえらんでください</span></div>
    <div class="tools">
      <span class="label">向き</span>
      <button id="flipBtn">反転ずみ（向かい合わせ用）</button>
      <span class="sep"></span>
      <span class="label">速さ</span>
      <button data-rate="0.5">0.5倍</button>
      <button data-rate="0.75">0.75倍</button>
      <button data-rate="1" class="on">ふつう</button>
    </div>
    <p class="note">※ 練習用の見本です。速さを落としたり、向きを切り替えたりして使ってください。</p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let meta, video, cur, flipped = false, rate = 1;

function renderAudios() {
  const wrap = $('audioList');
  wrap.innerHTML = '';
  if (!meta.audios || !meta.audios.length) { $('audioSec').hidden = true; return; }
  meta.audios.forEach(a => {
    const box = document.createElement('div');
    box.innerHTML = `<p class="meta">${a.title} <span>（${a.date}）</span></p>`;
    const au = document.createElement('audio');
    au.controls = true; au.preload = 'metadata'; au.src = a.src;
    box.appendChild(au);
    const tools = document.createElement('div');
    tools.className = 'tools';
    tools.innerHTML = '<span class="label">速さ</span>';
    [0.5, 0.75, 1].forEach(r => {
      const b = document.createElement('button');
      b.textContent = r === 1 ? 'ふつう' : r + '倍';
      if (r === 1) b.classList.add('on');
      b.onclick = () => {
        au.playbackRate = r;
        tools.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      };
      tools.appendChild(b);
    });
    const dl = document.createElement('a');
    dl.className = 'btn'; dl.href = a.src; dl.download = ''; dl.textContent = '⬇ ダウンロード';
    tools.appendChild(document.createElement('span')).className = 'sep';
    tools.appendChild(dl);
    box.appendChild(tools);
    wrap.appendChild(box);
  });
}

function renderList() {
  $('list').innerHTML = '';
  meta.videos.slice().reverse().forEach(v => {
    const b = document.createElement('button');
    b.className = 'item' + (cur === v.id ? ' active' : '');
    b.innerHTML = `<span>${v.title}</span><small>${v.date}</small>`;
    b.onclick = () => play(v);
    $('list').appendChild(b);
  });
}

function play(v) {
  if (cur === v.id) return;
  cur = v.id; renderList();
  video = document.createElement('video');
  video.controls = true; video.playsInline = true; video.preload = 'metadata';
  video.setAttribute('controlsList', 'nodownload');
  video.oncontextmenu = e => e.preventDefault();
  video.src = v.src;
  video.playbackRate = rate;
  video.classList.toggle('flip', flipped);
  $('stage').innerHTML = ''; $('stage').appendChild(video);
}

$('flipBtn').onclick = () => {
  flipped = !flipped;
  $('flipBtn').textContent = flipped ? '元の向き（撮影したまま）' : '反転ずみ（向かい合わせ用）';
  if (video) video.classList.toggle('flip', flipped);
};
document.querySelectorAll('#videoSec [data-rate]').forEach(b => b.onclick = () => {
  rate = +b.dataset.rate;
  document.querySelectorAll('#videoSec [data-rate]').forEach(x => x.classList.toggle('on', x === b));
  if (video) video.playbackRate = rate;
});

(async () => {
  meta = await (await fetch('videos.json', { cache:'no-cache' })).json();
  renderAudios();
  renderList();
  if (meta.videos.length === 1) play(meta.videos[0]);
})();
</script>
</body>
</html>
