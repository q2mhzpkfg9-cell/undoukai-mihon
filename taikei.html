<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>団演 隊形図</title>
<style>
  :root { --bg:#f6f3ec; --card:#fff; --ink:#2b2a28; --sub:#7a756c; --accent:#e0703a; --line:#e6e0d4; --red:#e0443a; --blue:#2f6fd6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif; padding:24px 16px 48px; }
  main { max-width:960px; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .lead { color:var(--sub); margin:0 0 16px; font-size:.9rem; }
  .back { color:var(--sub); font-size:.9rem; text-decoration:none; display:inline-block; margin-bottom:10px; }
  button { font:inherit; font-size:.95rem; padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; color:inherit; }
  button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .scenes { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .scenes button { min-width:52px; }
  .stage { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:8px; }
  svg { width:100%; height:auto; display:block; touch-action:manipulation; }
  .caption { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin:10px 0; }
  .caption b { font-size:1.05rem; }
  .caption p { margin:4px 0 0; color:var(--sub); font-size:.9rem; }
  .tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
  .tools .label { color:var(--sub); font-size:.85rem; }
  .sep { flex-basis:100%; height:0; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:.85rem; color:var(--sub); margin-top:10px; }
  .dot { display:inline-block; width:11px; height:11px; border-radius:50%; vertical-align:-1px; margin-right:4px; }
  .note { color:var(--sub); font-size:.8rem; margin-top:14px; line-height:1.6; }
  .kid { cursor:pointer; }
</style>
</head>
<body>
<main>
  <a class="back" href="./">← 見本動画・音源へもどる</a>
  <h1>🗺️ 団演 隊形図（うごく）</h1>
  <p class="lead">番号をおすと、その隊形へ移動します。「通しで再生」で入場から退場まで動きます。</p>

  <div class="scenes" id="scenes"></div>
  <div class="caption" id="caption"></div>

  <div class="stage">
    <svg id="svg" viewBox="0 0 1000 700" aria-label="運動場の隊形図">
      <g transform="translate(0,60)">
        <g id="field"></g>
        <g id="guides"></g>
        <g id="trails"></g>
        <g id="route"></g>
        <g id="kids"></g>
      </g>
    </svg>
  </div>

  <div class="tools">
    <button id="prev">◀ もどる</button>
    <button id="play">▶ 通しで再生</button>
    <button id="next">すすむ ▶</button>
    <span class="sep"></span>
    <span class="label">速さ</span>
    <button data-speed="0.5">ゆっくり</button>
    <button data-speed="1" class="on">ふつう</button>
    <button data-speed="2">はやい</button>
    <span class="sep"></span>
    <span class="label">見る</span>
    <button data-cls="-1" class="on">ぜんぶ</button>
    <button data-cls="0">1</button>
    <button data-cls="1">2</button>
    <button data-cls="2">3</button>
    <button id="trailBtn" class="on">移動の線</button>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:var(--red)"></span>赤の列</span>
    <span><span class="dot" style="background:var(--blue)"></span>青の列</span>
    <span>●を1人タップ → その子の動きを全部表示（もう一度で解除）</span>
  </div>
  <p class="note">
    ※ 手書きの隊形図をもとに、動きがわかるように作った図です。人数・間隔は目安です。<br>
    ※ 上が入場門・退場門側、下が指揮台側です。
  </p>
</main>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};

// ---- 子ども：3グループ × 赤18・青18 = 108人 ----
const kids = [];
for (let c = 0; c < 3; c++) for (const col of ['r', 'b']) for (let i = 0; i < 18; i++)
  kids.push({ id: kids.length, c, col, i });
const pick = (c, col) => kids.filter(k => k.c === c && k.col === col);

const CX = [265, 467, 688];          // 5・6G / 3・4G / 1・2G のライン
const ring = (cx, cy, r, n, a0 = -Math.PI / 2) =>
  Array.from({ length: n }, (_, j) => [cx + r * Math.cos(a0 + 2 * Math.PI * j / n), cy + r * Math.sin(a0 + 2 * Math.PI * j / n)]);
const ringR = n => Math.max(14, n * 2.4);

// ---- 隊形 ----
function fStart() {
  const P = [];
  kids.forEach((k, n) => P[k.id] = [30 + Math.floor(n / 4) * 11.5, -44 + (n % 4) * 11]);
  return { P, guides: [] };
}
function f1() {
  // 次の隊形②で行く方向に合わせて輪の場所を決める（線が交差しにくい）
  const P = [], cx = 480, cy = 255, rx = 290, ry = 150, next = f2().P;
  const ang = k => Math.atan2((next[k.id][1] - cy) / ry, (next[k.id][0] - cx) / rx);
  [...kids].sort((a, b) => ang(a) - ang(b)).forEach((k, j) => {
    const a = -Math.PI + 2 * Math.PI * (j + .5) / kids.length;
    P[k.id] = [cx + rx * Math.cos(a), cy + 50 + ry * Math.sin(a)];
  });
  return { P, guides: [['ellipse', { cx, cy: cy + 50, rx: rx + 14, ry: ry + 14 }]], labels: [] };
}
function f2() {
  const P = [], off = [-27, -9, 9, 27];
  for (let c = 0; c < 3; c++) for (const col of ['r', 'b']) pick(c, col).forEach((k, i) => {
    const base = col === 'r' ? 0 : 2;
    if (i < 2) P[k.id] = [CX[c] + off[base + i], 170];
    else { const m = i - 2; P[k.id] = [CX[c] + off[base + m % 2], 192 + Math.floor(m / 2) * 20]; }
  });
  return { P, guides: [], labels: CX.map((x, c) => [x, 145, c + 1]) };
}
function f3() {
  const P = [], G = [], rc = [5, 4, 5, 4], bc = [4, 5, 4, 5];
  for (let c = 0; c < 3; c++) {
    const ox = o => CX[c] + (o % 2 ? 14 : -14), oy = o => 190 + o * 52;
    for (const [col, cnt, dx] of [['r', rc, -18], ['b', bc, 18]]) {
      let i = 0; const list = pick(c, col);
      cnt.forEach((n, o) => { for (let j = 0; j < n; j++) P[list[i++].id] = [ox(o) + dx, oy(o) + (j - (n - 1) / 2) * 9]; });
    }
    for (let o = 0; o < 4; o++) G.push(['ellipse', { cx: ox(o), cy: oy(o), rx: 40, ry: 27 }]);
  }
  return { P, guides: G, labels: CX.map((x, c) => [x, 145, c + 1]) };
}
function f4() {
  const P = [], G = [];
  const colX = [[237, 307], [420, 477], [615, 700]], rY = [250, 362], bY = [306, 420];
  const topB = [320, 190], topR = [612, 190];
  const plan = { // [輪1, 輪2, 合同の輪へ]
    '0r': [9, 9, 0], '1r': [7, 7, 4], '2r': [7, 7, 4],
    '0b': [7, 7, 4], '1b': [7, 7, 4], '2b': [9, 9, 0] };
  const toTop = { r: [], b: [] };
  for (let c = 0; c < 3; c++) for (const col of ['r', 'b']) {
    const list = pick(c, col), [n1, n2] = plan[c + col];
    const x = colX[c][col === 'r' ? 0 : 1], ys = col === 'r' ? rY : bY;
    [[n1, ys[0]], [n2, ys[1]]].reduce((s, [n, y]) => {
      ring(x, y, ringR(n), n).forEach((p, j) => P[list[s + j].id] = p);
      G.push(['circle', { cx: x, cy: y, r: ringR(n) + 9, col }]);
      return s + n;
    }, 0);
    list.slice(n1 + n2).forEach(k => toTop[col].push(k));
  }
  [['b', topB], ['r', topR]].forEach(([col, [x, y]]) => {
    const l = toTop[col];
    ring(x, y, ringR(l.length), l.length).forEach((p, j) => P[l[j].id] = p);
    G.push(['circle', { cx: x, cy: y, r: ringR(l.length) + 9, col }]);
  });
  return { P, guides: G, labels: [[topB[0], 150, '1+2'], [topR[0], 150, '3+2']] };
}
function f5() {
  const P = [], G = [];
  for (let c = 0; c < 3; c++) for (const col of ['r', 'b']) {
    const sx = col === 'r' ? -1 : 1;
    pick(c, col).forEach((k, i) => {
      if (i < 2) { P[k.id] = [CX[c] + sx * (i ? 9 : 27), 166]; return; }
      const m = i - 2, g = Math.floor(m / 4), gx = CX[c] + sx * 22, gy = 200 + g * 42;
      const a = Math.PI / 4 + (m % 4) * Math.PI / 2;
      P[k.id] = [gx + 10 * Math.cos(a), gy + 10 * Math.sin(a)];
      if (m % 4 === 0) G.push(['circle', { cx: gx, cy: gy, r: 19, col }]);
    });
  }
  return { P, guides: G, labels: CX.map((x, c) => [x, 145, c + 1]) };
}
const C6 = [[260, 430], [467, 178], [695, 450]];
function f6() {
  const P = [], G = [];
  for (let c = 0; c < 3; c++) {
    const [cx, cy] = C6[c];
    for (const col of ['r', 'b']) pick(c, col).forEach((k, i) => P[k.id] = [cx + (col === 'r' ? -12 : 12), cy - 72 + i * 8.5]);
    G.push(['circle', { cx, cy, r: 88 }]);
    G.push(['text', { x: cx + 30, y: cy - 66, t: '高' }]);
    G.push(['text', { x: cx + 30, y: cy + 80, t: '低' }]);
  }
  return { P, guides: G, labels: C6.map(([x, y], c) => [x - 52, y + 6, c + 1]) };
}
function fExit() {
  const P = [], delay = [];
  const L = [pick(0, 'r'), pick(0, 'b'), pick(1, 'r')], R = [pick(2, 'r'), pick(2, 'b'), pick(1, 'b')];
  L.forEach((row, r) => row.forEach((k, j) => { P[k.id] = [175 - (17 - j) * 11, -36 + r * 13]; delay[k.id] = j / 18; }));
  R.forEach((row, r) => row.forEach((k, j) => { P[k.id] = [795 + (17 - j) * 11, -36 + r * 13]; delay[k.id] = j / 18; }));
  return { P, guides: [], labels: [], delay };
}

const SCENES = [
  { no: '入場前', title: '入場門にならぶ', desc: '入場門（左上）の外で待ちます。', f: fStart },
  { no: '①', title: '入場（Carrying Happiness）→ 大きな輪', desc: '入場して、トラックの内側いっぱいに大きな輪になります。', f: f1, stagger: true },
  { no: '②', title: '3つに分かれて4列', desc: '1・2・3に分かれ、左2列が赤・右2列が青。', f: f2 },
  { no: '③', title: '赤と青の2列で小さな輪×4', desc: 'それぞれ4つの輪。輪は左右に少しずつずらします。', f: f3 },
  { no: '④', title: '赤・青の輪をたがいちがいに', desc: '上の2つは合同の輪（1+2 ／ 3+2）。', f: f4 },
  { no: '⑤', title: '4人ずつの小さな輪', desc: '赤の輪が左、青の輪が右に4つずつならびます。', f: f5 },
  { no: '⑥', title: '大きな円が3つ', desc: '円の中に赤・青の2列。高い子が上（入場門側）。', f: f6 },
  { no: '退場', title: '退場（高い子を先頭に）', desc: '1と2の赤は左へ、3と2の青は右へ出ます。', f: fExit },
];
const DATA = SCENES.map(s => s.f());

// ---- 運動場 ----
(function drawField() {
  const g = $('field');
  el('rect', { x: -10, y: -60, width: 1020, height: 700, fill: '#f3ead8' }, g);
  el('rect', { x: 20, y: 45, width: 950, height: 540, rx: 270, fill: '#e9dcc2', stroke: '#b9a582', 'stroke-width': 2 }, g);
  el('rect', { x: 95, y: 108, width: 800, height: 395, rx: 197, fill: '#f3ead8', stroke: '#b9a582', 'stroke-width': 2 }, g);
  el('rect', { x: 182, y: 227, width: 573, height: 143, fill: 'none', stroke: '#cdbd9c', 'stroke-width': 1.5 }, g);
  [[265, '5・6G'], [467, '3・4G'], [688, '1・2G']].forEach(([x, t]) => {
    el('line', { x1: x, y1: 25, x2: x, y2: 600, stroke: '#cdbd9c', 'stroke-width': 1.5, 'stroke-dasharray': '6 6' }, g);
    el('text', { x: x + 4, y: 40, 'font-size': 13, fill: '#a8987a' }, g).textContent = t;
  });
  el('rect', { x: 452, y: 612, width: 46, height: 20, fill: '#fff', stroke: '#a8987a' }, g);
  el('text', { x: 475, y: 650, 'font-size': 14, fill: '#7a756c', 'text-anchor': 'middle' }, g).textContent = '指揮台';
  [[150, '入場'], [800, '退場']].forEach(([x, t]) => {
    el('rect', { x: x - 6, y: 5, width: 12, height: 12, fill: '#fff', stroke: '#7a756c' }, g);
    el('text', { x: x, y: -2, 'font-size': 15, fill: '#7a756c', 'text-anchor': 'middle', 'font-weight': 'bold' }, g).textContent = t;
  });
  const defs = el('defs', {}, $('svg'));
  for (const [id, c] of [['ar', '#e0443a'], ['ab', '#2f6fd6']]) {
    const m = el('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto-start-reverse' }, defs);
    el('path', { d: 'M0,0 L10,5 L0,10 z', fill: c }, m);
  }
})();

// ---- 子どもの● ----
const COLOR = { r: '#e0443a', b: '#2f6fd6' };
const dots = kids.map(k => {
  const d = el('circle', { r: 5, fill: COLOR[k.col], stroke: '#fff', 'stroke-width': 1.2, class: 'kid' }, $('kids'));
  d.addEventListener('click', () => { focus = focus === k.id ? null : k.id; render(); });
  return d;
});

let cur = 0, pos = DATA[0].P.map(p => [...p]), speed = 1, cls = -1, showTrail = true, focus = null, anim = null, playing = false;

function visible(k) { return (cls < 0 || k.c === cls) && (focus === null || k.id === focus); }

function drawGuides() {
  const g = $('guides'); g.innerHTML = '';
  const d = DATA[cur];
  d.guides.forEach(([t, a]) => {
    if (t === 'text') { el('text', { x: a.x, y: a.y, 'font-size': 14, fill: '#7a756c' }, g).textContent = a.t; return; }
    const stroke = a.col ? (a.col === 'r' ? '#e0443a' : '#2f6fd6') : '#8a7f6c';
    const { col, ...rest } = a;
    el(t, { ...rest, fill: 'none', stroke, 'stroke-opacity': a.col ? .35 : .5, 'stroke-width': 1.5, 'stroke-dasharray': a.col ? '' : '5 4' }, g);
  });
  (d.labels || []).forEach(([x, y, t]) => {
    el('circle', { cx: x, cy: y - 5, r: 13, fill: '#fff', stroke: '#2b2a28', 'stroke-width': 1.3 }, g);
    el('text', { x, y: y, 'font-size': String(t).length > 1 ? 11 : 15, 'text-anchor': 'middle', 'font-weight': 'bold', fill: '#2b2a28' }, g).textContent = t;
  });
}

function drawTrails() {
  const g = $('trails'); g.innerHTML = '';
  if (!showTrail || cur === 0 || focus !== null) return;
  const A = DATA[cur - 1].P, B = DATA[cur].P;
  kids.forEach(k => {
    if (!visible(k)) return;
    const [x1, y1] = A[k.id], [x2, y2] = B[k.id];
    if (Math.hypot(x2 - x1, y2 - y1) < 4) return;
    el('line', { x1, y1, x2, y2, stroke: COLOR[k.col], 'stroke-opacity': cls < 0 ? .28 : .55, 'stroke-width': 1.4, 'marker-end': `url(#a${k.col})` }, g);
  });
}

function drawRoute() {
  const g = $('route'); g.innerHTML = '';
  if (focus === null) return;
  const pts = DATA.map(d => d.P[focus]);
  el('polyline', { points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: COLOR[kids[focus].col], 'stroke-width': 2.5, 'stroke-opacity': .6, 'stroke-dasharray': '7 5' }, g);
  pts.forEach((p, i) => {
    el('circle', { cx: p[0], cy: p[1], r: 11, fill: '#fff', stroke: COLOR[kids[focus].col], 'stroke-width': 1.5, opacity: i === cur ? 0 : .9 }, g);
    el('text', { x: p[0], y: p[1] + 4, 'font-size': 10, 'text-anchor': 'middle', fill: '#2b2a28' }, g).textContent = ['入', '1', '2', '3', '4', '5', '6', '退'][i];
  });
}

function paintDots() {
  kids.forEach(k => {
    const d = dots[k.id], [x, y] = pos[k.id];
    d.setAttribute('cx', x); d.setAttribute('cy', y);
    const v = visible(k);
    d.setAttribute('opacity', v ? 1 : .15);
    d.setAttribute('r', focus === k.id ? 8 : 5);
  });
}

function render() {
  const s = SCENES[cur];
  $('caption').innerHTML = `<b>${s.no}　${s.title}</b><p>${s.desc}</p>`;
  $('scenes').querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === cur));
  drawGuides(); drawTrails(); drawRoute(); paintDots();
}

const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function goTo(n, done) {
  if (n < 0 || n >= SCENES.length) return;
  cancelAnimationFrame(anim);
  const from = pos.map(p => [...p]), to = DATA[n].P, back = n < cur;
  const delay = DATA[n].delay || (SCENES[n].stagger && !back ? kids.map((k, j) => (j % 108) / 108 * .5) : null);
  cur = n; render();
  const T = (back ? 900 : 2600) / speed, t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / T);
    kids.forEach(k => {
      const d = delay ? delay[k.id] * .5 : 0;
      const u = ease(Math.max(0, Math.min(1, (t - d) / (1 - (delay ? .5 : 0)))));
      pos[k.id] = [from[k.id][0] + (to[k.id][0] - from[k.id][0]) * u, from[k.id][1] + (to[k.id][1] - from[k.id][1]) * u];
    });
    paintDots();
    if (t < 1) anim = requestAnimationFrame(step); else if (done) done();
  };
  anim = requestAnimationFrame(step);
}

function stopPlay() { playing = false; $('play').textContent = '▶ 通しで再生'; $('play').classList.remove('on'); }
function playAll() {
  if (playing) { stopPlay(); return; }
  playing = true; $('play').textContent = '■ とめる'; $('play').classList.add('on');
  if (cur === SCENES.length - 1) { cur = 0; pos = DATA[0].P.map(p => [...p]); render(); }
  const nextStep = () => {
    if (!playing) return;
    if (cur >= SCENES.length - 1) { stopPlay(); return; }
    goTo(cur + 1, () => setTimeout(nextStep, 1200 / speed));
  };
  setTimeout(nextStep, 400);
}

SCENES.forEach((s, i) => {
  const b = document.createElement('button');
  b.textContent = s.no;
  b.onclick = () => { stopPlay(); goTo(i); };
  $('scenes').appendChild(b);
});
$('prev').onclick = () => { stopPlay(); goTo(cur - 1); };
$('next').onclick = () => { stopPlay(); goTo(cur + 1); };
$('play').onclick = playAll;
$('trailBtn').onclick = () => { showTrail = !showTrail; $('trailBtn').classList.toggle('on', showTrail); render(); };
document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => {
  speed = +b.dataset.speed;
  document.querySelectorAll('[data-speed]').forEach(x => x.classList.toggle('on', x === b));
});
document.querySelectorAll('[data-cls]').forEach(b => b.onclick = () => {
  cls = +b.dataset.cls; focus = null;
  document.querySelectorAll('[data-cls]').forEach(x => x.classList.toggle('on', x === b));
  render();
});
render();
</script>
</body>
</html>
